spring.application.name=hr_system

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:mysql://localhost:3306/saham_hr_db_staging
spring.jpa.hibernate.ddl-auto=update

springdoc.api-docs.path=/api-docs



## Server Configuration:
server.port= 8081
server.address=0.0.0.0

## Logging:
logging.file.name=logs/hr_system.log
logging.level.root=INFO
logging.level.com.saham=DEBUG
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File storage:
file.upload.medical-certificates=${MEDICAL_CERTIFICATES_PATH}
file.upload.payrolls=${PAYROLLS_PATH}
file.upload.profile-pictures=src/main/resources/pictures



## Lazy Initialization:
spring.main.lazy-initialization=true
secret.key=${JWT_SECRET_KEY}

#Email Configuration:
outlook.tenant-id=${TENANT_ID}
outlook.client-id=${CLIENT_ID}
outlook.client-secret=${EMAIL_SECRET_KEY}
outlook.user-email=${USER_EMAIL}

# Front End App
frontend.url=${CLIENT_APP_URL}

app.server.url=http://192.168.15.27:8081

