name: CI/CD Pipeline

on:
  push:
    branches: [ develop, release, main ]
  pull_request:
    branches: [ develop ]


# Environment Variables & Secrets
env:
  DB_USERNAME : ${{ secrets.DB_USERNAME }}
  DB_PASSWORD : ${{ secrets.DB_PASSWORD }}
  JWT_SECRET_KEY : ${{ secrets.JWT_SECRET_KEY }}
  TENANT_ID : ${{ secrets.TENANT_ID }}
  CLIENT_ID : ${{ secrets.CLIENT_ID }}
  EMAIL_SECRET_KEY : ${{ secrets.EMAIL_SECRET_KEY }}
  USER_EMAIL : ${{ secrets.USER_EMAIL }}
  MEDICAL_CERTIFICATES_PATH: /tmp/medical-certificates
  PAYROLLS_PATH: /tmp/payrolls

jobs:

  # Job 1 : Build and Test the code
  build-and-test:
    environment: test
    runs-on: ubuntu-latest

    # Pull a database image service for building and testing
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: medjool
          MYSQL_DATABASE: saham_hr_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build and run tests
        run: mvn clean package

      - name : Static Code Analysis
        env:
          SONAR_TOKEN = ${{ secrets.SONAR_TOKEN }}
        run : |
           mvn org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
          -Dsonar.host.url=https://sonarcloud.io

      - name : Static Code Analysis Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload JAR Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: 'hr_system-jar'
          path: 'target/*.jar'

  # Job 2 : Deploy the Artifact to staging environment
  deploy-to-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy to Staging
        run: echo "Deploying to staging environment..."
  # Job 3 : Deploy to production environment using Manual Approval Gate