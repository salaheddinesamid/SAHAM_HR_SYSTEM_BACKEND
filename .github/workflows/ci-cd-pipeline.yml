name: CI/CD Pipeline

on:
  push:
    branches: [ develop, release, main ]
  pull_request:
    branches: [ develop ]

env:
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
  TENANT_ID: ${{ secrets.TENANT_ID }}
  CLIENT_ID: ${{ secrets.CLIENT_ID }}
  EMAIL_SECRET_KEY: ${{ secrets.EMAIL_SECRET_KEY }}
  USER_EMAIL: ${{ vars.USER_EMAIL }}
  MEDICAL_CERTIFICATES_PATH: /tmp/medical-certificates
  PAYROLLS_PATH: /tmp/payrolls

jobs:

  # -------------------------
  # 1. BUILD & TEST
  # -------------------------
  build-and-test:
    runs-on: ubuntu-latest
    environment: test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: medjool
          MYSQL_DATABASE: saham_hr_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build & Test
        run: mvn clean package

      - name: Static Code Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
          -Dsonar.host.url=https://sonarcloud.io

      - name: Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hr-system-jar
          path: target/*.jar

  # -------------------------
  # 2. STAGING
  # -------------------------
  deploy-to-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hr-system-jar

      - name: Deploy to staging (placeholder)
        run: echo "Deploying to staging..."

  # -------------------------
  # 3. PRODUCTION (Manual Approval)
  # -------------------------
  deploy-to-production:
    needs: deploy-to-staging
    runs-on: ubuntu-latest
    environment: production  # requires approval in GitHub

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hr-system-jar

      # Copy JAR to Windows Server
      - name: Copy JAR to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "*.jar"
          target: "C:/apps/spring-app/"

      # Restart service via SSH
      - name: Restart Spring Boot Service
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sc stop spring-app
            timeout /t 5
            sc start spring-app