name: CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    environment: staging
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: medjool
          MYSQL_DATABASE: saham_hr_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_USERNAME: root
      DB_PASSWORD: medjool
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      MEDICAL_CERTIFICATES_PATH: /tmp/medical-certificates
      PAYROLLS_PATH: /tmp/payrolls
      TENANT_ID: ${{ secrets.TENANT_ID }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      EMAIL_SECRET_KEY: ${{ secrets.EMAIL_SECRET_KEY }}
      USER_EMAIL: ${{ secrets.USER_EMAIL }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build and run tests
        run: mvn clean verify